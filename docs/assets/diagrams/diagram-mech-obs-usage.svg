<rect width="1440" height="840" fill="#ffffff"/>
<text x="720" y="52" text-anchor="middle" font-size="33" font-weight="600" fill="#1f2d3d">图 M-OBS-U-01：可观测性机制的用途概览</text>
<text x="720" y="86" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6b7d">Current · LLMTier 纯软件单进程 · 图注与正文共同解释</text>
<rect x="40" y="130" width="400" height="560" rx="14" fill="#f7f9fc" stroke="#c7d4e4" stroke-width="1.5"/>
<text x="240.0" y="170" text-anchor="middle" font-size="22" font-weight="600" fill="#2f6fb5">使用场景 / 触发</text>
<rect x="58.0" y="215.0" width="364.0" height="60.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="240.0" y="252.0" text-anchor="middle" font-size="21" font-weight="600">一次上游调用结束（快照）</text>
<rect x="58.0" y="297.0" width="364.0" height="60.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="240.0" y="334.0" text-anchor="middle" font-size="21" font-weight="600">每次请求完成（统计）</text>
<rect x="58.0" y="379.0" width="364.0" height="60.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="240.0" y="416.0" text-anchor="middle" font-size="21" font-weight="600">Operator 切换全局开关</text>
<rect x="58.0" y="461.0" width="364.0" height="60.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="240.0" y="498.0" text-anchor="middle" font-size="21" font-weight="600">Operator 配置故障注入</text>
<rect x="58.0" y="543.0" width="364.0" height="60.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="240.0" y="580.0" text-anchor="middle" font-size="21" font-weight="600">按 request_id 查询 trace</text>
<rect x="520" y="130" width="400" height="560" rx="14" fill="#f7f9fc" stroke="#c7d4e4" stroke-width="1.5"/>
<text x="720.0" y="170" text-anchor="middle" font-size="22" font-weight="600" fill="#2f6fb5">处理范围</text>
<rect x="538.0" y="215.0" width="364.0" height="86.0" rx="12" fill="#dce9f8" stroke="#c7d4e4" stroke-width="2"/><text x="720.0" y="252.0" text-anchor="middle" font-size="21" font-weight="600">按开关决定是否写入（关闭零开销</text><text x="720.0" y="278.0" text-anchor="middle" font-size="19" font-weight="400">）</text>
<rect x="538.0" y="323.0" width="364.0" height="60.0" rx="12" fill="#dce9f8" stroke="#c7d4e4" stroke-width="2"/><text x="720.0" y="360.0" text-anchor="middle" font-size="21" font-weight="600">注入配置在路由前生效</text>
<rect x="538.0" y="405.0" width="364.0" height="60.0" rx="12" fill="#dce9f8" stroke="#c7d4e4" stroke-width="2"/><text x="720.0" y="442.0" text-anchor="middle" font-size="21" font-weight="600">统计内存累积 + 小时桶</text>
<rect x="538.0" y="487.0" width="364.0" height="60.0" rx="12" fill="#dce9f8" stroke="#c7d4e4" stroke-width="2"/><text x="720.0" y="524.0" text-anchor="middle" font-size="21" font-weight="600">脱敏/截断后持久</text>
<rect x="1000" y="130" width="400" height="560" rx="14" fill="#f7f9fc" stroke="#c7d4e4" stroke-width="1.5"/>
<text x="1200.0" y="170" text-anchor="middle" font-size="22" font-weight="600" fill="#2f6fb5">输出结果</text>
<rect x="1018.0" y="215.0" width="364.0" height="60.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="1200.0" y="252.0" text-anchor="middle" font-size="21" font-weight="600">快照 / 统计 / trace 查询结果</text>
<rect x="1018.0" y="297.0" width="364.0" height="60.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="1200.0" y="334.0" text-anchor="middle" font-size="21" font-weight="600">X-Request-ID 与关联标识回显</text>
<rect x="1018.0" y="379.0" width="364.0" height="60.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="1200.0" y="416.0" text-anchor="middle" font-size="21" font-weight="600">故障注入生效（source=injected）</text>
<rect x="1018.0" y="461.0" width="364.0" height="60.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="1200.0" y="498.0" text-anchor="middle" font-size="21" font-weight="600">写失败 fail-open，不阻断推理</text>
<line x1="442" y1="410" x2="518" y2="410" stroke="#2f6fb5" stroke-width="2.5" marker-end="url(#ahb)"/><text x="480" y="395" text-anchor="middle" font-size="17" fill="#44566b" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">触发/输入</text>
<line x1="922" y1="410" x2="998" y2="410" stroke="#2f6fb5" stroke-width="2.5" marker-end="url(#ahb)"/><text x="960" y="395" text-anchor="middle" font-size="17" fill="#44566b" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">处理</text>
<text x="720" y="812" text-anchor="middle" font-size="16" font-weight="400" fill="#7a8899">不提供：Secret/prompt 正文记录、自动轮询、跨系统分布式追踪后端。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="t d">
<title id="t">图 M-CONFIG-O-01：数据对象、变换与寿命</title><desc id="d">settings.json 经校验变换为 SQLite 行；bootstrap_sha256 固定一次性权威；Candidate 为请求级只读投影。</desc>

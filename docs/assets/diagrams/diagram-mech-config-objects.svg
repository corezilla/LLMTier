<rect width="1440" height="840" fill="#ffffff"/>
<text x="720" y="52" text-anchor="middle" font-size="33" font-weight="600" fill="#1f2d3d">图 M-CONFIG-O-01：数据对象、变换与寿命</text>
<text x="720" y="86" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6b7d">Current · LLMTier 纯软件单进程 · 图注与正文共同解释</text>
<text x="720" y="138" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6b7d">唯一权威：Management 决定、Store 事务写入、SQLite 为事实来源；D-CFG-SETTINGS 机器源 llmtier-settings-v0.3。</text>
<text x="720" y="171" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6b7d">所有权转移：settings 文件 → 库内 Registry 后文件不再影响运行（INV-1）；Candidate 为每次请求重新核验的投影。</text>
<rect x="40.0" y="280.0" width="314.5" height="200.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="197.25" y="348.0" text-anchor="middle" font-size="21" font-weight="600">D-CFG-SETTINGS</text><text x="197.25" y="374.0" text-anchor="middle" font-size="19" font-weight="400">settings JSON（schema</text><text x="197.25" y="400.0" text-anchor="middle" font-size="19" font-weight="400">v0.3）</text><text x="197.25" y="426.0" text-anchor="middle" font-size="19" font-weight="400">仅引导时读取；不热载</text>
<line x1="354.5" y1="380.0" x2="388.5" y2="380.0" stroke="#2f6fb5" stroke-width="2.5" marker-end="url(#ahb)"/><text x="371.5" y="264" text-anchor="middle" font-size="17" fill="#44566b" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">读取/解析</text>
<rect x="388.5" y="280.0" width="314.5" height="200.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="545.75" y="348.0" text-anchor="middle" font-size="21" font-weight="600">引用完整 + 固定 Tier</text><text x="545.75" y="374.0" text-anchor="middle" font-size="19" font-weight="400">Secret 只存 env:/file:</text><text x="545.75" y="400.0" text-anchor="middle" font-size="19" font-weight="400">引用</text><text x="545.75" y="426.0" text-anchor="middle" font-size="19" font-weight="400">原子提交或全回滚</text>
<line x1="703.0" y1="380.0" x2="737.0" y2="380.0" stroke="#2f6fb5" stroke-width="2.5" marker-end="url(#ahb)"/><text x="720.0" y="264" text-anchor="middle" font-size="17" fill="#44566b" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">校验/事务提交</text>
<rect x="737.0" y="280.0" width="314.5" height="200.0" rx="12" fill="#dce9f8" stroke="#c7d4e4" stroke-width="2"/><text x="894.25" y="322.0" text-anchor="middle" font-size="21" font-weight="600">8</text><text x="894.25" y="348.0" text-anchor="middle" font-size="19" font-weight="400">张表（providers/deployment</text><text x="894.25" y="374.0" text-anchor="middle" font-size="19" font-weight="400">s/…）</text><text x="894.25" y="400.0" text-anchor="middle" font-size="19" font-weight="400">schema_meta.bootstrap_sha2</text><text x="894.25" y="426.0" text-anchor="middle" font-size="19" font-weight="400">56</text><text x="894.25" y="452.0" text-anchor="middle" font-size="19" font-weight="400">version + audit_events</text>
<line x1="1051.5" y1="380.0" x2="1085.5" y2="380.0" stroke="#2f6fb5" stroke-width="2.5" marker-end="url(#ahb)"/><text x="1068.5" y="264" text-anchor="middle" font-size="17" fill="#44566b" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">持久投影</text>
<rect x="1085.5" y="280.0" width="314.5" height="200.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="1242.75" y="361.0" text-anchor="middle" font-size="21" font-weight="600">D-CFG-CANDIDATE</text><text x="1242.75" y="387.0" text-anchor="middle" font-size="19" font-weight="400">按 ordinal 有序</text><text x="1242.75" y="413.0" text-anchor="middle" font-size="19" font-weight="400">请求级只读；不持久</text>
<text x="720" y="812" text-anchor="middle" font-size="16" font-weight="400" fill="#7a8899">数据图只表达对象变化与寿命；引导/变更时序见 §6。</text>

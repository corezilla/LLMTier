<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1360" viewBox="0 0 1120 1360" role="img">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#4a6478"/></marker></defs>
<style>text{font-family:'PingFang SC',Arial,sans-serif;fill:#1f3140}.t{font-size:20px;font-weight:600}.s{font-size:14px;font-weight:500}.e{font-size:12px;fill:#5a6b7a}.step{fill:#e8f0f9;stroke:#8aa9c9;stroke-width:1.4}.decision{fill:#fff4d6;stroke:#c9a14a;stroke-width:1.5}.term{fill:#e6f4ea;stroke:#6ba77e;stroke-width:1.4}.err{fill:#fdeaea;stroke:#c98a8a;stroke-width:1.4}</style>
<rect width="1120" height="1360" fill="#fff"/>
<text x="30" y="40" class="t">M002 Web UI — 内部流程（加载 → 编辑保存）</text>
<rect x="400" y="70" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="103.0" class="s" text-anchor="middle">operator 打开页面（SPA 路由）</text>
<rect x="400" y="150" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="183.0" class="s" text-anchor="middle">I1 Frame/Nav 渲染框架（&lt;960px 折叠侧栏）</text>
<rect x="400" y="240" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="273.0" class="s" text-anchor="middle">I2 API Client 同源 GET（经 SSO 代理）</text>
<polygon points="540.0,330 700,385.0 540.0,440 380,385.0" class="decision"/>
<text x="540.0" y="390.0" class="s" text-anchor="middle">判定：认证状态?</text>
<rect x="40" y="330" width="300" height="56" rx="8" class="err"/>
<text x="190.0" y="352.0" class="s" text-anchor="middle">401 → 清 UI 会话</text>
<text x="190.0" y="374.0" class="s" text-anchor="middle">跳外部登录</text>
<polygon points="540.0,490 700,545.0 540.0,600 380,545.0" class="decision"/>
<text x="540.0" y="550.0" class="s" text-anchor="middle">判定：数据可用?</text>
<rect x="40" y="490" width="300" height="56" rx="8" class="err"/>
<text x="190.0" y="512.0" class="s" text-anchor="middle">403 无 operator 权限</text>
<text x="190.0" y="534.0" class="s" text-anchor="middle">（不猜存在性）</text>
<rect x="780" y="490" width="300" height="56" rx="8" class="err"/>
<text x="930.0" y="512.0" class="s" text-anchor="middle">503 保留旧画面</text>
<text x="930.0" y="534.0" class="s" text-anchor="middle">标记 data may be stale</text>
<rect x="400" y="660" width="300" height="56" rx="8" class="term"/>
<text x="550.0" y="693.0" class="s" text-anchor="middle">I3–I7 渲染（Tier 树 / 表 / 页签 / tabs）</text>
<rect x="400" y="760" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="793.0" class="s" text-anchor="middle">用户编辑 → I2 GET item 存 ETag</text>
<rect x="400" y="850" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="883.0" class="s" text-anchor="middle">I3/I4 表单字段级校验（英文就近错误）</text>
<rect x="400" y="940" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="973.0" class="s" text-anchor="middle">I2 PATCH + If-Match（管理面）</text>
<polygon points="540.0,1030 700,1085.0 540.0,1140 380,1085.0" class="decision"/>
<text x="540.0" y="1090.0" class="s" text-anchor="middle">判定：保存结果?</text>
<rect x="40" y="1030" width="300" height="56" rx="8" class="err"/>
<text x="190.0" y="1052.0" class="s" text-anchor="middle">412 stale</text>
<text x="190.0" y="1074.0" class="s" text-anchor="middle">提示并保留用户输入</text>
<rect x="780" y="1030" width="300" height="56" rx="8" class="err"/>
<text x="930.0" y="1052.0" class="s" text-anchor="middle">409 引用冲突</text>
<text x="930.0" y="1074.0" class="s" text-anchor="middle">显示引用摘要，禁强删</text>
<rect x="400" y="1200" width="300" height="56" rx="8" class="term"/>
<text x="550.0" y="1233.0" class="s" text-anchor="middle">I9 更新视图（保存成功 ≠ health/probe 成功）</text>
<line x1="550" y1="126" x2="550" y2="150" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="550" y1="206" x2="550" y2="240" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="550" y1="296" x2="540" y2="330" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="380" y1="385" x2="340" y2="358" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="368" y="372" class="e">401</text>
<line x1="540" y1="440" x2="540" y2="490" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="548" y="465" class="e">通过</text>
<line x1="380" y1="545" x2="340" y2="518" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="368" y="532" class="e">403</text>
<line x1="700" y1="545" x2="780" y2="518" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="748" y="532" class="e">503</text>
<line x1="540" y1="600" x2="550" y2="660" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="553" y="630" class="e">200</text>
<line x1="550" y1="716" x2="550" y2="760" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="550" y1="816" x2="550" y2="850" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="550" y1="906" x2="550" y2="940" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="550" y1="996" x2="540" y2="1030" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="380" y1="1085" x2="340" y2="1058" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="368" y="1072" class="e">412</text>
<line x1="700" y1="1085" x2="780" y2="1058" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="748" y="1072" class="e">409</text>
<line x1="540" y1="1140" x2="550" y2="1200" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="553" y="1170" class="e">200</text>
</svg>
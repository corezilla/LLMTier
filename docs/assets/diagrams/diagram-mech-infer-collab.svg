<text x="720" y="826" text-anchor="middle" font-size="15" font-weight="400" fill="#7a8899">每条跨单元边界对应 §5.1/§5.2；外部后端调用经 §5.1 IF-INF-COMPLETE，M-METER/M-CONFIG 接口按引用登记。</text>

<line x1="905.0" y1="287" x2="1045.0" y2="287" stroke="#2f6fb5" stroke-width="2.5" marker-end="url(#ahb)"/><text x="975.0" y="277.0" text-anchor="middle" font-size="17" fill="#44566b" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">IF-INF-COMPLETE</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="t d">
<title id="t">图 M-INFER-C-01：参与方、事实与跨边界交接</title><desc id="d">入口终止 HTTP/SSE；Inference 归一；Router 决定许可与候选；Provider Adapter 是唯一外部调用点。</desc>

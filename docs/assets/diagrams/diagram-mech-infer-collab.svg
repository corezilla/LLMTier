<text x="720" y="86" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6b7d">Current · LLMTier 纯软件单进程 · 图注与正文共同解释</text>
<rect x="45.0" y="250.0" width="190.0" height="100.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="140.0" y="268.0" text-anchor="middle" font-size="21" font-weight="600">Consumer</text><text x="140.0" y="294.0" text-anchor="middle" font-size="19" font-weight="400">(Piko)</text><text x="140.0" y="320.0" text-anchor="middle" font-size="19" font-weight="400">POST</text><text x="140.0" y="346.0" text-anchor="middle" font-size="19" font-weight="400">/v1/responses</text>
<rect x="315.0" y="225.0" width="230.0" height="150.0" rx="12" fill="#dce9f8" stroke="#c7d4e4" stroke-width="2"/><text x="430.0" y="268.0" text-anchor="middle" font-size="21" font-weight="600">HTTP/SSE Adapter</text><text x="430.0" y="294.0" text-anchor="middle" font-size="19" font-weight="400">终止 HTTP/SSE</text><text x="430.0" y="320.0" text-anchor="middle" font-size="19" font-weight="400">拥有：帧序与</text><text x="430.0" y="346.0" text-anchor="middle" font-size="19" font-weight="400">terminal</text>
<rect x="675.0" y="225.0" width="230.0" height="150.0" rx="12" fill="#dce9f8" stroke="#c7d4e4" stroke-width="2"/><text x="790.0" y="268.0" text-anchor="middle" font-size="21" font-weight="600">Inference 编排</text><text x="790.0" y="294.0" text-anchor="middle" font-size="19" font-weight="400">校验 + 归一</text><text x="790.0" y="320.0" text-anchor="middle" font-size="19" font-weight="400">拥有：ResponsesRes</text><text x="790.0" y="346.0" text-anchor="middle" font-size="19" font-weight="400">ponse</text>
<rect x="675.0" y="555.0" width="230.0" height="130.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="790.0" y="588.0" text-anchor="middle" font-size="21" font-weight="600">Router / Admission</text><text x="790.0" y="614.0" text-anchor="middle" font-size="19" font-weight="400">许可 + 同等级候选</text><text x="790.0" y="640.0" text-anchor="middle" font-size="19" font-weight="400">拥有：内存并发/队</text><text x="790.0" y="666.0" text-anchor="middle" font-size="19" font-weight="400">列</text>
<rect x="1045.0" y="235.0" width="250.0" height="130.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="1170.0" y="294.0" text-anchor="middle" font-size="21" font-weight="600">Provider Adapter</text><text x="1170.0" y="320.0" text-anchor="middle" font-size="19" font-weight="400">唯一外部调用点</text>
<rect x="1045.0" y="560.0" width="250.0" height="120.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="1170.0" y="601.0" text-anchor="middle" font-size="21" font-weight="600">Usage Recorder</text><text x="1170.0" y="627.0" text-anchor="middle" font-size="19" font-weight="400">(M-METER)</text><text x="1170.0" y="653.0" text-anchor="middle" font-size="19" font-weight="400">义务→绑定→终态</text>
<rect x="270.0" y="560.0" width="220.0" height="120.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="380.0" y="601.0" text-anchor="middle" font-size="21" font-weight="600">Registry / Config</text><text x="380.0" y="627.0" text-anchor="middle" font-size="19" font-weight="400">(M-CONFIG)</text><text x="380.0" y="653.0" text-anchor="middle" font-size="19" font-weight="400">等级/能力只读</text>

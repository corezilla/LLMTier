<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">LLMTier System Architecture — UI / Business / Foundation</title>
  <desc id="desc">LLMTier internal layered composition with three layers and eight modules. UI layer: HTTP API and Web UI. Business layer (transaction processing): Inference, Management, Observability. Foundation layer (shared capabilities): libdiag, util, log. External systems are not drawn here; see the runtime/environment section. Composition only; no processes or call order implied.</desc>
  <style>
    text {font-family:'PingFang SC','Helvetica Neue',Arial,sans-serif;fill:#20364e}
    .title {font-size:28px;font-weight:600}
    .subtitle {font-size:14px;fill:#65788b}
    .layer {font-size:20px;font-weight:600;text-anchor:end}
    .name {font-size:18px;font-weight:600;text-anchor:middle}
    .mid {font-size:13px;fill:#65788b;font-weight:400}
    .modnote {font-size:12px;fill:#65788b;text-anchor:middle}
    .note {font-size:13px;fill:#65788b}
    .panel {stroke-width:1.5}
    .component {stroke-width:1.3}
    .new-component {fill:#fff3cd;stroke:#856404;stroke-width:1.5}
    .new-label {fill:#856404;font-weight:600;font-size:12px}
  </style>
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="60" y="50" class="title">LLMTier System Architecture</text>
  <text x="60" y="73" class="subtitle">Three layers · eight modules — UI / Business / Foundation</text>
  <text x="1220" y="50" class="note" text-anchor="end">EX-LLMTIER/v3 · Target</text>
  <text x="1220" y="68" class="note" text-anchor="end">LLMTier v0.3.0-draft</text>
  <text x="1220" y="86" class="note" text-anchor="end">no external systems · see runtime section</text>

  <!-- Layer 1: UI -->
  <text x="195" y="160" class="layer">入口层<br/>UI</text>
  <rect x="230" y="118" width="990" height="96" rx="12" fill="#f0f6fd" stroke="#bccfe5" class="panel"/>
  <rect x="250" y="140" width="465" height="54" rx="8" fill="#dceafb" stroke="#9dbbdb" class="component"/>
  <text x="482.5" y="174" class="name">HTTP API<tspan class="mid"> M001</tspan></text>
  <rect x="735" y="140" width="465" height="54" rx="8" fill="#dceafb" stroke="#9dbbdb" class="component"/>
  <text x="967.5" y="174" class="name">Web UI<tspan class="mid"> M002</tspan></text>

  <!-- Layer 2: Business -->
  <text x="195" y="288" class="layer">业务层<br/>Business</text>
  <rect x="230" y="246" width="990" height="96" rx="12" fill="#eef5fa" stroke="#b6ccdc" class="panel"/>
  <rect x="250" y="268" width="300" height="54" rx="8" fill="#c8deef" stroke="#8aafcb" class="component"/>
  <text x="400" y="302" class="name">Inference<tspan class="mid"> M003</tspan></text>
  <rect x="570" y="268" width="300" height="54" rx="8" fill="#c8deef" stroke="#8aafcb" class="component"/>
  <text x="720" y="302" class="name">Management<tspan class="mid"> M004</tspan></text>
  <rect x="890" y="268" width="310" height="54" rx="8" class="new-component"/>
  <text x="1045" y="302" class="name">Observability<tspan class="mid"> M005</tspan></text>
  <text x="1045" y="331" class="new-label">新模块</text>

  <!-- Layer 3: Foundation -->
  <text x="195" y="436" class="layer">基础层<br/>Foundation</text>
  <rect x="230" y="394" width="990" height="120" rx="12" fill="#f3f5f7" stroke="#c1cbd4" class="panel"/>
  <rect x="250" y="416" width="300" height="76" rx="8" class="new-component"/>
  <text x="400" y="450" class="name">libdiag<tspan class="mid"> M006</tspan></text>
  <text x="400" y="472" class="modnote">调试开关 · 注入 · 观测记录</text>
  <rect x="570" y="416" width="300" height="76" rx="8" fill="#dce2e8" stroke="#a4b2c0" class="component"/>
  <text x="720" y="450" class="name">util<tspan class="mid"> M007</tspan></text>
  <text x="720" y="472" class="modnote">配置 · 存储 · 信任 · 杂项</text>
  <rect x="890" y="416" width="310" height="76" rx="8" fill="#dce2e8" stroke="#a4b2c0" class="component"/>
  <text x="1045" y="450" class="name">log<tspan class="mid"> M008</tspan></text>
  <text x="1045" y="472" class="modnote">日志 · 可扩展</text>

  <!-- Dependency description (no arrows across modules; layering only) -->
  <text x="240" y="556" class="note">依赖方向：入口层 → 业务层 → 基础层（只向下）。同层模块不互相调用。</text>
  <text x="240" y="578" class="note">业务层三模块平级；基础层三模块被业务层共同依赖，libdiag 可依赖 util/log。</text>
  <text x="240" y="600" class="note">外部系统（consumer、模型后端）与部署形态见运行环境章，不在此图。</text>

  <!-- Legend -->
  <rect x="60" y="630" width="1160" height="46" rx="6" fill="#fafafa" stroke="#ddd"/>
  <text x="80" y="657" class="subtitle">图例</text>
  <rect x="140" y="646" width="20" height="14" rx="3" class="new-component"/>
  <text x="165" y="660" class="note">新增/本次涉及（Observability · libdiag）</text>
  <rect x="480" y="646" width="20" height="14" rx="3" fill="#dceafb" stroke="#9dbbdb" class="component"/>
  <text x="505" y="660" class="note">入口层</text>
  <rect x="620" y="646" width="20" height="14" rx="3" fill="#c8deef" stroke="#8aafcb" class="component"/>
  <text x="645" y="660" class="note">业务层</text>
  <rect x="760" y="646" width="20" height="14" rx="3" fill="#dce2e8" stroke="#a4b2c0" class="component"/>
  <text x="785" y="660" class="note">基础层</text>
</svg>
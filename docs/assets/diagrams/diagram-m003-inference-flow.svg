<polygon points="560.0,880 720,935.0 560.0,990 400,935.0" class="decision"/>
<text x="560.0" y="940.0" class="s" text-anchor="middle">判定：许可可得?</text>
<rect x="40" y="880" width="300" height="56" rx="8" class="err"/>
<text x="190.0" y="902.0" class="s" text-anchor="middle">429 rate_limit_exceeded</text>
<text x="190.0" y="924.0" class="s" text-anchor="middle">503 model_unavailable</text>
<rect x="420" y="1070" width="300" height="56" rx="8" class="step"/>
<text x="570.0" y="1103.0" class="s" text-anchor="middle">I5 usage.bind_backend（最终 provider/deployment）</text>
<rect x="420" y="1150" width="300" height="56" rx="8" class="step"/>

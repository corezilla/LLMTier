<rect width="1160" height="1720" fill="#fff"/>
<text x="30" y="40" class="t">M003 Inference — 内部流程（P-INFER 推理编排 / P-EMBED 向量化）</text>
<rect x="420" y="70" width="300" height="56" rx="8" class="step"/>
<text x="570.0" y="103.0" class="s" text-anchor="middle">入口 ResponsesService.create(principal, request_id, body)</text>
<rect x="420" y="150" width="300" height="56" rx="8" class="step"/>
<text x="570.0" y="183.0" class="s" text-anchor="middle">I1 校验：必填字段 → stream/store → 禁字段</text>
<polygon points="560.0,240 720,295.0 560.0,350 400,295.0" class="decision"/>

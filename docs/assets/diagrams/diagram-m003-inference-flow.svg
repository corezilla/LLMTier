<text x="190.0" y="1284.0" class="s" text-anchor="middle">503 provider_unavailable</text>
<rect x="420" y="1430" width="300" height="56" rx="8" class="step"/>
<text x="570.0" y="1463.0" class="s" text-anchor="middle">I7 归一 ResponsesResponse（output/status/usage）</text>
<rect x="420" y="1510" width="300" height="56" rx="8" class="step"/>

<rect width="1440" height="840" fill="#ffffff"/>
<text x="720" y="52" text-anchor="middle" font-size="33" font-weight="600" fill="#1f2d3d">图 M-OBS-O-01：数据对象、变换与寿命</text>
<text x="720" y="86" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6b7d">Current · LLMTier 纯软件单进程 · 图注与正文共同解释</text>
<text x="720" y="138" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6b7d">唯一权威：libdiag（M006）拥有记录与列；Observability 只读呈现；统计缓存进程退出即丢。</text>
<text x="720" y="171" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6b7d">一致性：同 request_id trace 有序，跨请求无全局顺序；观测与 M-METER 账本故障域隔离，不得据观测缺失推断未发生调用。</text>
<rect x="40.0" y="280.0" width="314.5" height="200.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="197.25" y="348.0" text-anchor="middle" font-size="21" font-weight="600">请求路径事件</text><text x="197.25" y="374.0" text-anchor="middle" font-size="19" font-weight="400">received/validated/routed/</text><text x="197.25" y="400.0" text-anchor="middle" font-size="19" font-weight="400">…</text><text x="197.25" y="426.0" text-anchor="middle" font-size="19" font-weight="400">上游 status/时延</text>
<line x1="354.5" y1="380.0" x2="388.5" y2="380.0" stroke="#2f6fb5" stroke-width="2.5" marker-end="url(#ahb)"/><text x="371.5" y="264" text-anchor="middle" font-size="17" fill="#44566b" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">脱敏/截断</text>
<rect x="388.5" y="280.0" width="314.5" height="200.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="545.75" y="361.0" text-anchor="middle" font-size="21" font-weight="600">URL 去 query</text><text x="545.75" y="387.0" text-anchor="middle" font-size="19" font-weight="400">error_summary ≤256B</text><text x="545.75" y="413.0" text-anchor="middle" font-size="19" font-weight="400">不记 Secret/正文</text>
<line x1="703.0" y1="380.0" x2="737.0" y2="380.0" stroke="#2f6fb5" stroke-width="2.5" marker-end="url(#ahb)"/><text x="720.0" y="264" text-anchor="middle" font-size="17" fill="#44566b" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">持久化</text>
<rect x="737.0" y="280.0" width="314.5" height="200.0" rx="12" fill="#dce9f8" stroke="#c7d4e4" stroke-width="2"/><text x="894.25" y="348.0" text-anchor="middle" font-size="21" font-weight="600">diagnostic_snapshots</text><text x="894.25" y="374.0" text-anchor="middle" font-size="19" font-weight="400">trace_events /</text><text x="894.25" y="400.0" text-anchor="middle" font-size="19" font-weight="400">data_plane_stats</text><text x="894.25" y="426.0" text-anchor="middle" font-size="19" font-weight="400">快照/trace 7 天</text>
<line x1="1051.5" y1="380.0" x2="1085.5" y2="380.0" stroke="#2f6fb5" stroke-width="2.5" marker-end="url(#ahb)"/><text x="1068.5" y="264" text-anchor="middle" font-size="17" fill="#44566b" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">只读组合</text>
<rect x="1085.5" y="280.0" width="314.5" height="200.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="1242.75" y="361.0" text-anchor="middle" font-size="21" font-weight="600">D-OBS-SNAPSHOT/STATS/TRACE</text><text x="1242.75" y="387.0" text-anchor="middle" font-size="19" font-weight="400">只读组合</text><text x="1242.75" y="413.0" text-anchor="middle" font-size="19" font-weight="400">请求级、非持久</text>
<text x="720" y="812" text-anchor="middle" font-size="16" font-weight="400" fill="#7a8899">数据图只表达对象变化；记录/查询时序见 §6，fail-open 见 §9。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1660" viewBox="0 0 1120 1660" role="img">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#4a6478"/></marker></defs>
<style>text{font-family:'PingFang SC',Arial,sans-serif;fill:#1f3140}.t{font-size:20px;font-weight:600}.s{font-size:14px;font-weight:500}.e{font-size:12px;fill:#5a6b7a}.step{fill:#e8f0f9;stroke:#8aa9c9;stroke-width:1.4}.decision{fill:#fff4d6;stroke:#c9a14a;stroke-width:1.5}.term{fill:#e6f4ea;stroke:#6ba77e;stroke-width:1.4}.err{fill:#fdeaea;stroke:#c98a8a;stroke-width:1.4}</style>
<rect width="1120" height="1660" fill="#fff"/>
<text x="30" y="40" class="t">M001 HTTP API — 内部流程（P-API-REQ 分发 / P-API-SSE 流式）</text>
<rect x="400" y="70" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="103.0" class="s" text-anchor="middle">请求到达</text>
<rect x="400" y="150" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="183.0" class="s" text-anchor="middle">I1 生成 request_id</text>
<polygon points="540.0,250 700,305.0 540.0,360 380,305.0" class="decision"/>
<text x="540.0" y="310.0" class="s" text-anchor="middle">判定：端点类别</text>
<rect x="40" y="250" width="300" height="56" rx="8" class="term"/>
<text x="190.0" y="272.0" class="s" text-anchor="middle">I1 直接响应</text>
<text x="190.0" y="294.0" class="s" text-anchor="middle">（/healthz · /readyz · /ui/*）</text>
<rect x="780" y="250" width="300" height="56" rx="8" class="err"/>
<text x="930.0" y="272.0" class="s" text-anchor="middle">引导失败</text>
<text x="930.0" y="294.0" class="s" text-anchor="middle">返回 bootstrap 错误</text>
<rect x="400" y="430" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="463.0" class="s" text-anchor="middle">I2 按端点选角色 + 判定信任</text>
<polygon points="540.0,520 700,575.0 540.0,630 380,575.0" class="decision"/>
<text x="540.0" y="580.0" class="s" text-anchor="middle">判定：信任通过?</text>
<rect x="40" y="520" width="300" height="56" rx="8" class="err"/>
<text x="190.0" y="542.0" class="s" text-anchor="middle">401 / 403</text>
<text x="190.0" y="564.0" class="s" text-anchor="middle">（不泄露存在性）</text>
<rect x="400" y="700" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="733.0" class="s" text-anchor="middle">I2 解析 body（限长 2 MB）</text>
<polygon points="540.0,790 700,845.0 540.0,900 380,845.0" class="decision"/>
<text x="540.0" y="850.0" class="s" text-anchor="middle">判定：body 合法?</text>
<rect x="40" y="790" width="300" height="56" rx="8" class="err"/>
<text x="190.0" y="812.0" class="s" text-anchor="middle">413 request_too_large</text>
<text x="190.0" y="834.0" class="s" text-anchor="middle">400 invalid_json</text>
<rect x="400" y="970" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="1003.0" class="s" text-anchor="middle">I1 调用业务处理器（M003/M004/M005）</text>
<polygon points="540.0,1060 700,1115.0 540.0,1170 380,1115.0" class="decision"/>
<text x="540.0" y="1120.0" class="s" text-anchor="middle">判定：SSE 分支?</text>
<rect x="40" y="1060" width="300" height="56" rx="8" class="term"/>
<text x="190.0" y="1082.0" class="s" text-anchor="middle">I1 写 JSON 响应</text>
<text x="190.0" y="1104.0" class="s" text-anchor="middle">（含 X-Request-ID）</text>
<rect x="400" y="1240" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="1273.0" class="s" text-anchor="middle">I3 发送 SSE 头 + 逐帧 flush</text>
<polygon points="540.0,1330 700,1385.0 540.0,1440 380,1385.0" class="decision"/>
<text x="540.0" y="1390.0" class="s" text-anchor="middle">判定：连接状态?</text>
<rect x="40" y="1330" width="300" height="56" rx="8" class="err"/>
<text x="190.0" y="1352.0" class="s" text-anchor="middle">I3 记 aborted</text>
<text x="190.0" y="1374.0" class="s" text-anchor="middle">结束本次调用</text>
<rect x="400" y="1510" width="300" height="56" rx="8" class="term"/>
<text x="550.0" y="1543.0" class="s" text-anchor="middle">I3 记 completed</text>
<rect x="400" y="1590" width="300" height="56" rx="8" class="step"/>
<text x="550.0" y="1623.0" class="s" text-anchor="middle">finally 关闭线程内 Store 连接</text>
<line x1="550" y1="126" x2="550" y2="150" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="550" y1="206" x2="540" y2="250" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="380" y1="305" x2="340" y2="278" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="368" y="292" class="e">健康/静态</text>
<line x1="700" y1="305" x2="780" y2="278" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="748" y="292" class="e">引导失败</text>
<line x1="540" y1="360" x2="550" y2="430" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="553" y="395" class="e">业务</text>
<line x1="550" y1="486" x2="540" y2="520" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="380" y1="575" x2="340" y2="548" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="368" y="562" class="e">否</text>
<line x1="540" y1="630" x2="550" y2="700" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="553" y="665" class="e">是</text>
<line x1="550" y1="756" x2="540" y2="790" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="380" y1="845" x2="340" y2="818" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="368" y="832" class="e">否</text>
<line x1="540" y1="900" x2="550" y2="970" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="553" y="935" class="e">是</text>
<line x1="550" y1="1026" x2="540" y2="1060" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="380" y1="1115" x2="340" y2="1088" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="368" y="1102" class="e">否</text>
<line x1="540" y1="1170" x2="550" y2="1240" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="553" y="1205" class="e">是</text>
<line x1="550" y1="1296" x2="540" y2="1330" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="380" y1="1385" x2="340" y2="1358" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="368" y="1372" class="e">断开</text>
<line x1="540" y1="1440" x2="550" y2="1510" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="553" y="1475" class="e">正常</text>
<line x1="550" y1="1566" x2="550" y2="1590" stroke="#4a6478" stroke-width="1.4" marker-end="url(#ar)"/>
</svg>
<rect width="1440" height="840" fill="#ffffff"/>
<text x="720" y="52" text-anchor="middle" font-size="33" font-weight="600" fill="#1f2d3d">图 M-INFER-O-01：数据对象、变换与寿命</text>
<text x="720" y="86" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6b7d">Current · LLMTier 纯软件单进程 · 图注与正文共同解释</text>
<text x="720" y="138" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6b7d">唯一权威：wire 形状由 openapi 定义；归一后 ResponsesResponse 由 Inference 拥有，SSE 帧序由出口拥有。</text>
<text x="720" y="171" text-anchor="middle" font-size="18" font-weight="400" fill="#5b6b7d">变换与损失：非流式模式被裁剪；usage 三 token 非皆 int 则整条 unknown；不承诺跨系统 exactly-once。</text>
<rect x="40.0" y="280.0" width="244.8" height="200.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="162.4" y="348.0" text-anchor="middle" font-size="21" font-weight="600">D-MSG-RESPONSE</text><text x="162.4" y="374.0" text-anchor="middle" font-size="19" font-weight="400">model/input</text><text x="162.4" y="400.0" text-anchor="middle" font-size="19" font-weight="400">stream:true/store:fa</text><text x="162.4" y="426.0" text-anchor="middle" font-size="19" font-weight="400">lse</text>
<line x1="284.8" y1="380.0" x2="318.8" y2="380.0" stroke="#2f6fb5" stroke-width="2.5" marker-end="url(#ahb)"/><text x="301.8" y="264" text-anchor="middle" font-size="17" fill="#44566b" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">归一为上游请求</text>
<rect x="318.8" y="280.0" width="244.8" height="200.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="441.20000000000005" y="348.0" text-anchor="middle" font-size="21" font-weight="600">上游 provider 协议</text><text x="441.20000000000005" y="374.0" text-anchor="middle" font-size="19" font-weight="400">Secret 经 secret_ref</text><text x="441.20000000000005" y="400.0" text-anchor="middle" font-size="19" font-weight="400">解析</text><text x="441.20000000000005" y="426.0" text-anchor="middle" font-size="19" font-weight="400">请求级内存</text>
<line x1="563.6" y1="380.0" x2="597.6" y2="380.0" stroke="#2f6fb5" stroke-width="2.5" marker-end="url(#ahb)"/><text x="580.6" y="264" text-anchor="middle" font-size="17" fill="#44566b" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">调用后端</text>
<rect x="597.6" y="280.0" width="244.8" height="200.0" rx="12" fill="#dce9f8" stroke="#c7d4e4" stroke-width="2"/><text x="720.0" y="335.0" text-anchor="middle" font-size="21" font-weight="600">D-INF-PROVIDER-RESUL</text><text x="720.0" y="361.0" text-anchor="middle" font-size="19" font-weight="400">T</text><text x="720.0" y="387.0" text-anchor="middle" font-size="19" font-weight="400">output/usage/status/</text><text x="720.0" y="413.0" text-anchor="middle" font-size="19" font-weight="400">error</text><text x="720.0" y="439.0" text-anchor="middle" font-size="19" font-weight="400">usage 缺失 → unknown</text>

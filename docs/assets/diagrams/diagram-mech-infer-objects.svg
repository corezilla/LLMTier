<rect x="876.4000000000001" y="280.0" width="244.8" height="200.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="998.8000000000001" y="361.0" text-anchor="middle" font-size="21" font-weight="600">D-MSG-SSE</text><text x="998.8000000000001" y="387.0" text-anchor="middle" font-size="19" font-weight="400">一 terminal + [DONE]</text><text x="998.8000000000001" y="413.0" text-anchor="middle" font-size="19" font-weight="400">sequence 单调</text>
<line x1="1121.2" y1="380.0" x2="1155.2" y2="380.0" stroke="#2f6fb5" stroke-width="2.5" marker-end="url(#ahb)"/><text x="1138.2" y="264" text-anchor="middle" font-size="17" fill="#44566b" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round">序列化</text>
<rect x="1155.2" y="280.0" width="244.8" height="200.0" rx="12" fill="#eef3fb" stroke="#c7d4e4" stroke-width="2"/><text x="1277.6000000000001" y="361.0" text-anchor="middle" font-size="21" font-weight="600">usage → M-METER</text><text x="1277.6000000000001" y="387.0" text-anchor="middle" font-size="19" font-weight="400">unknown 不补零</text><text x="1277.6000000000001" y="413.0" text-anchor="middle" font-size="19" font-weight="400">本机制不保留历史</text>
<text x="720" y="812" text-anchor="middle" font-size="16" font-weight="400" fill="#7a8899">数据图只表达对象变化；调用与等待时序见 §6，失败传播见 §9。</text>

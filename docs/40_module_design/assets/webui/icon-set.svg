<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
  <style>
    .bg{fill:#f5f6f8}.panel{fill:#fff;stroke:#e3e7ed}.title{font:700 24px system-ui;fill:#303640}.section{font:700 15px system-ui;fill:#303640}.name{font:600 13px system-ui;fill:#303640}.note{font:12px system-ui;fill:#7b8490}.icon{fill:none;stroke:#334155;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ok{stroke:#0f766e}.warn{stroke:#a16207}.bad{stroke:#c2410c}.muted{stroke:#64748b}
  </style>

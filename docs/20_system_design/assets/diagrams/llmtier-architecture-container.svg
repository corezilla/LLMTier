<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">LLMTier System Architecture Diagram with Observability Subsystem</title>
  <desc id="desc">LLMTier system architecture (Container View, C4 Level 2) including the observability subsystem. LLMTier is composed of OpenAI-compatible API, Admin API plus Web UI, Logical Model Registry, Routing plus Provider Adapters, Usage Meter, Diagnostic Service (observability mechanism), and Config/Runtime State/Usage/Audit/Diagnostics Store. External actors: Piko (agent runtime), Slinky (memory), oMLX (model backend). Diagrams show composition by responsibility; runtime processes are in §6 and call/sequence diagrams in §7.</desc>
  <style>
    text {font-family:'PingFang SC','Helvetica Neue',Arial,sans-serif;fill:#20364e}
    .title {font-size:30px;font-weight:600}
    .subtitle {font-size:15px;fill:#65788b}
    .layer {font-size:22px;font-weight:600;text-anchor:end}
    .name {font-size:20px;font-weight:600;text-anchor:middle}
    .note {font-size:14px;fill:#65788b}
    .arrow {stroke:#3a6fa0;stroke-width:1.6;fill:none}
    .arrow-config {stroke:#8a4baf;stroke-width:1.6;stroke-dasharray:5,4;fill:none}
    .panel {stroke-width:1.5}
    .component {stroke-width:1.3}
    .new-component {fill:#fff3cd;stroke:#856404;stroke-width:1.5}
    .new-label {fill:#856404;font-weight:600;font-size:13px}
    .external {fill:#f5f5f5;stroke:#999;stroke-width:1.2}
  </style>
  <rect width="1440" height="900" fill="#ffffff"/>

  <!-- Title block -->
  <text x="60" y="50" class="title">LLMTier System Architecture</text>
  <text x="60" y="74" class="subtitle">Container View (C4 Level 2) with Observability Subsystem</text>
  <text x="1380" y="50" class="note" text-anchor="end">EX-LLMTIER/v3 · Target</text>
  <text x="1380" y="68" class="note" text-anchor="end">LLMTier v0.3.0-draft</text>

  <!-- LLMTier Container boundary -->
  <rect x="350" y="100" width="900" height="700" rx="14" fill="#f8fafc" stroke="#a4b2c0" class="panel"/>
  <text x="370" y="128" class="subtitle">LLMTier software system</text>

  <!-- ===== Layer 1: Data Plane ===== -->
  <text x="335" y="178" class="layer">Data Plane</text>
  <rect x="370" y="148" width="860" height="110" rx="12" fill="#f0f6fd" stroke="#bccfe5" class="panel"/>
  <rect x="390" y="170" width="395" height="68" rx="8" fill="#dceafb" stroke="#9dbbdb" class="component"/>
  <text x="587.5" y="208" class="name">OpenAI-compatible API</text>
  <text x="587.5" y="226" class="subtitle">/v1/responses · /v1/embeddings</text>
  <rect x="805" y="170" width="405" height="68" rx="8" fill="#dceafb" stroke="#9dbbdb" class="component"/>
  <text x="1007.5" y="208" class="name">Admin API + English Web UI</text>
  <text x="1007.5" y="226" class="subtitle">/tier/admin/v1/* + /ui/*</text>

  <!-- ===== Layer 2: Logic ===== -->
  <text x="335" y="298" class="layer">Logic</text>
  <rect x="370" y="268" width="860" height="80" rx="12" fill="#eef5fa" stroke="#b6ccdc" class="panel"/>
  <rect x="390" y="290" width="200" height="38" rx="8" fill="#c8deef" stroke="#8aafcb" class="component"/>
  <text x="490" y="315" class="name">Logical Model Registry</text>
  <rect x="610" y="290" width="220" height="38" rx="8" fill="#c8deef" stroke="#8aafcb" class="component"/>
  <text x="720" y="315" class="name">Routing + Provider Adapters</text>
  <rect x="850" y="290" width="160" height="38" rx="8" fill="#c8deef" stroke="#8aafcb" class="component"/>
  <text x="930" y="315" class="name">Usage Meter</text>
  <rect x="1030" y="290" width="180" height="38" rx="8" class="new-component"/>
  <text x="1120" y="315" class="name">Diagnostic Service</text>
  <text x="1120" y="354" class="new-label">new module - LT-OBS-1..7</text>

  <!-- ===== Layer 3: Store ===== -->
  <text x="335" y="608" class="layer">Store</text>
  <text x="335" y="630" class="note" text-anchor="end">SQLite</text>
  <rect x="370" y="498" width="860" height="240" rx="12" fill="#f3f5f7" stroke="#c1cbd4" class="panel"/>

  <!-- Existing tables -->
  <text x="370" y="525" class="subtitle">existing tables</text>
  <rect x="390" y="535" width="160" height="35" rx="6" fill="#dce2e8" stroke="#a4b2c0"/>
  <text x="470" y="558" class="name">usage_obligations</text>
  <rect x="560" y="535" width="160" height="35" rx="6" fill="#dce2e8" stroke="#a4b2c0"/>
  <text x="640" y="558" class="name">usage_record_versions</text>
  <rect x="730" y="535" width="160" height="35" rx="6" fill="#dce2e8" stroke="#a4b2c0"/>
  <text x="810" y="558" class="name">usage_heads</text>
  <rect x="900" y="535" width="160" height="35" rx="6" fill="#dce2e8" stroke="#a4b2c0"/>
  <text x="980" y="558" class="name">provider_request_bindings</text>
  <rect x="1070" y="535" width="140" height="35" rx="6" fill="#dce2e8" stroke="#a4b2c0"/>
  <text x="1140" y="558" class="name">audit_events</text>

  <rect x="390" y="580" width="160" height="35" rx="6" fill="#dce2e8" stroke="#a4b2c0"/>
  <text x="470" y="603" class="name">operational_logs</text>

  <!-- New tables (yellow highlight) -->
  <text x="370" y="650" class="new-label">new tables - LT-OBS-1..6</text>
  <rect x="390" y="660" width="200" height="50" rx="6" class="new-component"/>
  <text x="490" y="681" class="name">diagnostic_snapshots</text>
  <text x="490" y="699" class="subtitle">LT-OBS-1</text>
  <rect x="610" y="660" width="200" height="50" rx="6" class="new-component"/>
  <text x="710" y="681" class="name">diagnostic_injections</text>
  <text x="710" y="699" class="subtitle">LT-OBS-5</text>
  <rect x="830" y="660" width="180" height="50" rx="6" class="new-component"/>
  <text x="920" y="681" class="name">data_plane_stats</text>
  <text x="920" y="699" class="subtitle">LT-OBS-2</text>
  <rect x="1030" y="660" width="180" height="50" rx="6" class="new-component"/>
  <text x="1120" y="681" class="name">trace_events</text>
  <text x="1120" y="699" class="subtitle">LT-OBS-6</text>

  <!-- ===== External Actors ===== -->
  <rect x="80" y="240" width="200" height="100" rx="10" fill="#f5f5f5" stroke="#999" class="external"/>
  <text x="180" y="270" class="name">Piko</text>
  <text x="180" y="290" class="subtitle">Agent Runtime</text>
  <text x="180" y="308" class="subtitle">127.0.0.1:8788</text>
  <text x="180" y="325" class="subtitle">joint-diagnose.sh</text>

  <rect x="80" y="500" width="200" height="100" rx="10" fill="#f5f5f5" stroke="#999" class="external"/>
  <text x="180" y="530" class="name">oMLX / Cloud</text>
  <text x="180" y="550" class="subtitle">Model Backend</text>
  <text x="180" y="568" class="subtitle">local / cloud</text>
  <text x="180" y="586" class="subtitle">provider API</text>

  <rect x="80" y="660" width="200" height="80" rx="10" fill="#f5f5f5" stroke="#999" class="external"/>
  <text x="180" y="688" class="name">Slinky</text>
  <text x="180" y="708" class="subtitle">Memory</text>
  <text x="180" y="725" class="subtitle">external - not in repo</text>

  <!-- ===== Arrows ===== -->
  <!-- Piko -> OpenAI-compatible API -->
  <line x1="280" y1="290" x2="370" y2="200" class="arrow"/>
  <polygon points="370,200 362,196 362,204" fill="#3a6fa0"/>
  <text x="290" y="240" class="subtitle">/v1/responses</text>

  <!-- Piko -> Admin API + Web UI -->
  <line x1="280" y1="320" x2="370" y2="240" class="arrow"/>
  <polygon points="370,240 362,236 362,244" fill="#3a6fa0"/>
  <text x="282" y="280" class="subtitle">/tier/admin/v1/*</text>

  <!-- Admin API -> Diagnostic Service (purple dashed) -->
  <line x1="1007" y1="240" x2="1120" y2="290" class="arrow-config"/>
  <polygon points="1120,290 1113,284 1113,290" fill="#8a4baf"/>

  <!-- OpenAI API -> Registry -> Routing -->
  <line x1="490" y1="238" x2="490" y2="290" class="arrow"/>
  <line x1="720" y1="290" x2="490" y2="328" class="arrow"/>

  <!-- Routing -> oMLX -->
  <line x1="610" y1="328" x2="280" y2="540" class="arrow"/>
  <polygon points="280,540 287,533 286,540" fill="#3a6fa0"/>
  <text x="298" y="430" class="subtitle">provider API</text>

  <!-- OpenAI API -> Usage Meter -->
  <line x1="785" y1="238" x2="930" y2="290" class="arrow"/>

  <!-- OpenAI API -> Diagnostic Service -->
  <line x1="700" y1="238" x2="1100" y2="290" class="arrow"/>
  <polygon points="1100,290 1093,284 1093,290" fill="#3a6fa0"/>

  <!-- Diagnostic Service -> diagnostic tables -->
  <line x1="1120" y1="328" x2="490" y2="660" class="arrow"/>
  <line x1="1120" y1="328" x2="710" y2="660" class="arrow"/>
  <line x1="1120" y1="328" x2="920" y2="660" class="arrow"/>
  <line x1="1120" y1="328" x2="1120" y2="660" class="arrow"/>

  <!-- Usage Meter -> usage tables -->
  <line x1="930" y1="328" x2="640" y2="535" class="arrow"/>

  <!-- Admin -> audit/logs -->
  <line x1="805" y1="238" x2="1140" y2="570" class="arrow"/>

  <!-- Slinky -> Admin (embeddings) -->
  <line x1="180" y1="660" x2="180" y2="340" class="arrow-config"/>

  <!-- ===== Legend ===== -->
  <rect x="60" y="820" width="1300" height="60" rx="6" fill="#fafafa" stroke="#ddd"/>
  <text x="80" y="845" class="subtitle">legend</text>
  <line x1="160" y1="842" x2="200" y2="842" class="arrow"/>
  <polygon points="200,842 192,838 192,846" fill="#3a6fa0"/>
  <text x="210" y="847" class="note">data / call (solid)</text>
  <line x1="400" y1="842" x2="440" y2="842" class="arrow-config"/>
  <polygon points="440,842 432,838 432,846" fill="#8a4baf"/>
  <text x="450" y="847" class="note">config / management (purple dashed)</text>
  <rect x="700" y="833" width="20" height="14" rx="3" class="new-component"/>
  <text x="725" y="847" class="note">new module / new table (LT-OBS-1..7)</text>
  <rect x="1010" y="833" width="20" height="14" rx="3" fill="#dce2e8" stroke="#a4b2c0"/>
  <text x="1035" y="847" class="note">existing module / table</text>
  <rect x="1190" y="833" width="20" height="14" rx="3" fill="#f5f5f5" stroke="#999"/>
  <text x="1215" y="847" class="note">external dep</text>

  <text x="80" y="870" class="subtitle">C4 Level 2 container composition. No process or runtime stack implied; see §6 deployment + §7 call/sequence diagrams.</text>
</svg>
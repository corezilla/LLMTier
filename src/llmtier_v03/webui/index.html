<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLMTier 管理台</title><link rel="stylesheet" href="/ui/styles.css"></head>
<body><div class="shell">
<aside><div class="brand"><b>LT</b><span><strong>LLMTier</strong><small>模型网关管理台</small></span></div><nav><button class="active" data-page="home">⌂　主页</button><button data-page="records">▥　用量与审计</button><button data-page="logs">≣　日志</button></nav><footer>单节点管理界面<br>标准 OpenAI 接口</footer></aside>
<main><header><div><h1 id="title">主页</h1><p id="subtitle">一页查看全部模型、Tier 与后端状态</p></div><span id="gateway" class="pill warn">● 正在连接</span></header>
<section id="home" class="page active"><div class="stats"><article><small>网关状态</small><strong id="stat-gateway">未知</strong></article><article><small>逻辑模型 / Tier</small><strong id="stat-tier">0</strong></article><article><small>后端总数</small><strong id="stat-backend">0</strong></article><article><small>健康 / 需关注</small><strong id="stat-health">0 / 0</strong></article></div><div class="toolbar"><input id="search" placeholder="搜索 Tier、供应商或模型"><button id="refresh">刷新状态</button><button class="primary" id="add">添加模型</button></div><div class="card"><div class="cardhead"><b>Tier / 后端树</b><span id="stamp">尚未刷新</span></div><div id="tree" class="tree empty">正在加载…</div></div></section>
<section id="records" class="page"><div class="tabs"><button class="active" data-tab="usage">Token 用量</button><button data-tab="audit">审计记录</button></div><div id="usage" class="sub active"><div class="card"><div class="cardhead"><b>统一 Token 用量</b><button id="refresh-usage">刷新</button></div><div class="tablewrap"><table><thead><tr><th>请求</th><th>模型</th><th>接口</th><th>输入</th><th>输出</th><th>总计</th><th>状态</th></tr></thead><tbody id="usage-body"></tbody></table></div></div></div><div id="audit" class="sub"><div class="card"><div class="cardhead"><b>管理审计</b><button id="refresh-audit">刷新</button></div><div class="tablewrap"><table><thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>对象</th><th>结果</th></tr></thead><tbody id="audit-body"></tbody></table></div></div></div></section>
<section id="logs" class="page"><div class="toolbar"><select id="log-level"><option value="">全部级别</option><option>info</option><option>warning</option><option>error</option></select><input id="log-module" placeholder="模块"><button id="refresh-logs">刷新</button></div><div class="card"><div class="cardhead"><b>运行日志</b><span>不显示请求正文、模型输出或凭据</span></div><div class="tablewrap"><table><thead><tr><th>时间</th><th>级别</th><th>模块</th><th>事件</th><th>摘要</th><th>请求 ID</th></tr></thead><tbody id="log-body"></tbody></table></div></div></section>
</main></div>
<div id="drawer-mask" class="mask"><aside class="drawer"><div class="drawerhead"><div><h2>添加模型</h2><p>先创建供应商与部署，再挂到固定 Tier。</p></div><button id="close">×</button></div><form id="model-form"><label>供应商名称<input name="provider_name" required></label><label>类型<select name="kind"><option value="cloud">云供应商</option><option value="local">本地模型</option></select></label><label>接口根地址<input name="endpoint" type="url" placeholder="http://127.0.0.1:9001/v1" required></label><label>Secret 引用<input name="secret_ref" placeholder="env:PROVIDER_TOKEN"></label><label>部署名称<input name="deployment_name" required></label><label>后端模型 ID<input name="backend_model" required></label><label>挂载 Tier<select name="tier" id="tier-select"></select></label><label>能力<select name="capability"><option value="responses">Responses</option><option value="embeddings">Embeddings</option></select></label><p id="form-error" class="error"></p><div class="formactions"><button type="button" id="cancel">取消</button><button class="primary">保存并挂载</button></div></form></aside></div>
<script src="/ui/app.js"></script></body></html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-tier"
version = "0.1.0"
description = "独立的 LLM Tier 路由与服务层"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm-tier = "llm_tier.__main__:main"
llm-tier-cli = "llm_tier.cli.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-tier"
version = "0.1.0"
description = "独立的 LLM Tier 路由与服务层"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5"]

[project.scripts]
llm-tier = "tier_service:main"
llm-tier-cli = "cli.__main__:main"
llm-tier-v03 = "llmtier_v03.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "client",
  "concurrency",
  "exceptions",
  "execution_identity",
  "mlexp_contract",
  "provider_usage",
  "quota_manager",
  "redaction",
  "router_core",
  "server",
  "stats_collector",
  "tier",
  "tier_config",
  "tier_core",
  "tier_model",
  "tier_service",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "at_*.py", "st_*.py"]
python_classes = ["Test*", "ST*"]
python_functions = ["test_*"]
markers = [
  "api_a: A 类 case（m5air 现有 state 直接打）",
  "api_b: B 类 case（临时 SQLite 实例）",
]
